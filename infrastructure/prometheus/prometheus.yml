# Scrapes every Go binary's /metrics endpoint. All application
# binaries run on the host via `go run`, not as
# Compose services, so Prometheus (which does run in Compose) reaches them
# through host.docker.internal - see the "prometheus" service's extra_hosts
# in compose.yaml for why that resolves on both Docker Desktop and plain
# Docker Engine.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: searchsync-api
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: searchsync-orders
    static_configs:
      - targets: ["host.docker.internal:8082"]

  - job_name: searchsync-inventory
    static_configs:
      - targets: ["host.docker.internal:8084"]

  - job_name: searchsync-payments
    static_configs:
      - targets: ["host.docker.internal:8085"]

  - job_name: searchsync-indexer
    static_configs:
      - targets: ["host.docker.internal:9101"]

  - job_name: searchsync-notifications
    static_configs:
      - targets: ["host.docker.internal:9102"]

  - job_name: searchsync-saga-coordinator
    static_configs:
      - targets: ["host.docker.internal:9103"]
