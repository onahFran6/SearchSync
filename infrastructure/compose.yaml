name: searchsync

networks:
  searchsync:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  es_data:
  prometheus_data:
  grafana_data:

services:
  postgres:
    image: postgres:16.4
    container_name: searchsync-postgres
    networks: [searchsync]
    env_file:
      - ../.env
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Single-broker Kafka in KRaft mode (no ZooKeeper). Internal listener "PLAINTEXT"
  # is used by containers on the "searchsync" network (advertised as kafka:19092);
  # "EXTERNAL" is published to the host as localhost:9092 for local tooling.
  kafka:
    image: apache/kafka:3.8.0
    container_name: searchsync-kafka
    networks: [searchsync]
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092"]
      interval: 10s
      timeout: 10s
      retries: 20

  connect:
    image: debezium/connect:3.0.0.Final
    container_name: searchsync-connect
    networks: [searchsync]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: searchsync-connect
      CONFIG_STORAGE_TOPIC: searchsync_connect_configs
      OFFSET_STORAGE_TOPIC: searchsync_connect_offsets
      STATUS_STORAGE_TOPIC: searchsync_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Single-node Elasticsearch for local development only.
  # xpack.security.enabled=false disables auth/TLS; never expose this configuration
  # outside localhost or run it against production data.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: searchsync-elasticsearch
    networks: [searchsync]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Scrapes every Go binary's /metrics over host.docker.internal
  # (the binaries themselves run on the host via `go run` - see
  # infrastructure/prometheus/prometheus.yml's header
  # comment). extra_hosts makes host.docker.internal resolve on plain
  # Docker Engine (Linux) too, not just Docker Desktop.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: searchsync-prometheus
    networks: [searchsync]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 10s
      retries: 20

  grafana:
    image: grafana/grafana:11.3.0
    container_name: searchsync-grafana
    networks: [searchsync]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-changeme}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Jaeger all-in-one: OTLP native ingestion (grpc 4317, http 4318) plus
  # its own UI - one container, no separate collector/storage backend,
  # sufficient for a local benchmarking rig (in-memory storage; traces do
  # not survive a restart, which is fine for this stage's purpose).
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: searchsync-jaeger
    networks: [searchsync]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/"]
      interval: 10s
      timeout: 10s
      retries: 20
